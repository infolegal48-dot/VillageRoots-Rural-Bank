<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian Bank — Online Banking</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.mb-app {
  --ink: #0B1220;
  --surface: #121C30;
  --surface-2: #1A2740;
  --surface-3: #24365A;
  --hairline: rgba(255,255,255,0.09);
  --hairline-strong: rgba(255,255,255,0.16);
  --text: #F2F4F8;
  --text-muted: #90999E60;
  --muted: #8D97B0;
  --brass: #C9A15C;
  --brass-bright: #E4C583;
  --teal: #45BE94;
  --coral: #E27467;
  --shadow: 0 20px 50px -25px rgba(0,0,0,0.6);
  --radius: 16px;
  font-family: 'Inter', sans-serif;
  background: var(--ink);
  color: var(--text);
  min-height: 100vh;
  width: 100%;
  position: relative;
  -webkit-font-smoothing: antialiased;
}
.mb-app[data-theme="light"] {
  --ink: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --surface-3: #E9EDF5;
  --hairline: rgba(16,24,38,0.09);
  --hairline-strong: rgba(16,24,38,0.16);
  --text: #101826;
  --muted: #5B6478;
  --shadow: 0 20px 50px -25px rgba(16,24,38,0.25);
}
.mb-app * { box-sizing: border-box; }
.mb-app .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.mb-app .display { font-family: 'Fraunces', serif; }
.mb-app button { font-family: inherit; cursor: pointer; }
.mb-app input, .mb-app select { font-family: inherit; }
.mb-app ::selection { background: var(--brass); color: #14100a; }

.mb-app :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- shell ---------- */
.mb-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.mb-sidebar {
  border-right: 1px solid var(--hairline);
  padding: 28px 18px;
  display: flex; flex-direction: column; gap: 28px;
  position: sticky; top: 0; height: 100vh;
}
.mb-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.mb-brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(155deg, var(--brass-bright), var(--brass) 60%, #8a6b34);
  display: flex; align-items: center; justify-content: center;
  color: #14100a; font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px;
  flex-shrink: 0;
}
.mb-brand-name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; letter-spacing: 0.01em; }
.mb-brand-sub { font-size: 10.5px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: -2px; }

.mb-nav { display: flex; flex-direction: column; gap: 3px; }
.mb-nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--muted); background: transparent; border: none;
  font-size: 14px; font-weight: 500; text-align: left; width: 100%;
  transition: background .15s ease, color .15s ease;
}
.mb-nav-item:hover { background: var(--surface-2); color: var(--text); }
.mb-nav-item.active { background: var(--surface-2); color: var(--brass-bright); }
.mb-nav-item.active svg { color: var(--brass-bright); }
.mb-nav-item svg { flex-shrink: 0; }

.mb-sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.mb-theme-toggle {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 10px; background: var(--surface-2);
  border: 1px solid var(--hairline); font-size: 12.5px; color: var(--muted);
}
.mb-switch { width: 34px; height: 19px; border-radius: 99px; background: var(--surface-3); position: relative; border: 1px solid var(--hairline-strong); flex-shrink: 0; transition: background .15s; }
.mb-switch.on { background: var(--brass); border-color: var(--brass); }
.mb-switch-dot { position: absolute; top: 1px; left: 1px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s ease; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.mb-switch.on .mb-switch-dot { transform: translateX(15px); }

.mb-logout { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--hairline); background: transparent; color: var(--muted); font-size: 13px; }
.mb-logout:hover { color: var(--coral); border-color: var(--coral); }

/* ---------- main / topbar ---------- */
.mb-main { min-width: 0; }
.mb-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 36px; border-bottom: 1px solid var(--hairline);
  position: sticky; top: 0; background: color-mix(in srgb, var(--ink) 88%, transparent);
  backdrop-filter: blur(10px); z-index: 20;
}
.mb-topbar-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; }
.mb-topbar-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.mb-topbar-right { display: flex; align-items: center; gap: 14px; }
.mb-icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--hairline);
  background: var(--surface); display: flex; align-items: center; justify-content: center;
  color: var(--muted); position: relative; flex-shrink: 0;
}
.mb-icon-btn:hover { color: var(--text); border-color: var(--hairline-strong); }
.mb-dot-badge { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); border: 2px solid var(--ink); }
.mb-avatar {
  width: 38px; height: 38px; border-radius: 10px; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
  color: var(--brass-bright); border: 1px solid var(--hairline);
}

.mb-content { padding: 32px 36px 80px; max-width: 1200px; }

/* ---------- ledger rule (signature motif) ---------- */
.mb-ledger-rule { height: 3px; background: linear-gradient(90deg, var(--brass) 0%, var(--brass) 40px, var(--hairline) 40px); margin: 6px 0 22px; }
.mb-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
.mb-section-head h2 { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin: 0; }
.mb-link { color: var(--brass-bright); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 3px; background: none; border: none; }

/* ---------- hero ---------- */
.mb-hero { padding: 26px 0 8px; }
.mb-hero-label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.mb-hero-amount { font-family: 'Fraunces', serif; font-size: 52px; font-weight: 500; margin: 6px 0 4px; display: flex; align-items: baseline; gap: 14px; }
.mb-hero-amount .num { font-family: 'Fraunces', serif; }
.mb-hero-delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); padding: 3px 9px; border-radius: 99px; }
.mb-eye-btn { background: none; border: none; color: var(--muted); display: flex; }
.mb-eye-btn:hover { color: var(--text); }

/* ---------- grid / cards ---------- */
.mb-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.mb-grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.mb-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 20px; }
.mb-card.pad-0 { padding: 0; }

/* account visual card */
.mb-acct-card { border-radius: 16px; padding: 18px 18px 16px; position: relative; overflow: hidden; cursor: pointer; border: 1px solid var(--hairline); min-height: 148px; display: flex; flex-direction: column; justify-content: space-between; transition: transform .15s ease; }
.mb-acct-card:hover { transform: translateY(-2px); }
.mb-acct-card::after { content: ''; position: absolute; right: -30px; top: -30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.05); }
.mb-acct-type { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; opacity: .75; }
.mb-acct-name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; margin-top: 2px; }
.mb-acct-num { font-size: 12px; opacity: .8; margin-top: 10px; }
.mb-acct-balance { font-size: 23px; font-weight: 600; margin-top: 12px; }

/* transaction row */
.mb-tx-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
.mb-tx-row:last-child { border-bottom: none; }
.mb-tx-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mb-tx-mid { flex: 1; min-width: 0; }
.mb-tx-merchant { font-size: 13.5px; font-weight: 500; }
.mb-tx-meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; display: flex; gap: 6px; align-items: center; }
.mb-tx-amt { font-size: 13.5px; font-weight: 600; flex-shrink: 0; }
.mb-cat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

.mb-badge { font-size: 10.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--hairline-strong); color: var(--muted); text-transform: capitalize; }
.mb-badge.ok { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 50%, transparent); }
.mb-badge.pending { color: var(--brass-bright); border-color: color-mix(in srgb, var(--brass) 50%, transparent); }

/* buttons */
.mb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; transition: opacity .15s, transform .1s; }
.mb-btn:active { transform: scale(0.98); }
.mb-btn-primary { background: var(--brass); color: #17130a; }
.mb-btn-primary:hover { opacity: .9; }
.mb-btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--hairline-strong); }
.mb-btn-secondary:hover { background: var(--surface-3); }
.mb-btn-ghost { background: transparent; color: var(--muted); }
.mb-btn-ghost:hover { color: var(--text); }
.mb-btn-danger { background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral); }
.mb-btn:disabled { opacity: .45; cursor: not-allowed; }
.mb-btn.block { width: 100%; }
.mb-btn.sm { padding: 7px 12px; font-size: 12.5px; }

.mb-quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.mb-quick-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--hairline); text-align: left; }
.mb-quick-btn:hover { border-color: var(--brass); }
.mb-quick-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--brass-bright); }

/* forms */
.mb-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.mb-field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.mb-input, .mb-select {
  background: var(--surface-2); border: 1px solid var(--hairline-strong); color: var(--text);
  border-radius: 9px; padding: 11px 12px; font-size: 13.5px; width: 100%;
}
.mb-input:focus, .mb-select:focus { border-color: var(--brass); }
.mb-input::placeholder { color: var(--muted); }
.mb-row { display: flex; gap: 12px; }
.mb-row > * { flex: 1; }

.mb-tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 11px; padding: 3px; gap: 2px; }
.mb-tab { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); background: transparent; border: none; }
.mb-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* table */
.mb-table { width: 100%; border-collapse: collapse; }
.mb-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 0 10px 10px; border-bottom: 1px solid var(--hairline-strong); }
.mb-table td { padding: 12px 10px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
.mb-table tr:last-child td { border-bottom: none; }
.mb-table th.num, .mb-table td.num { text-align: right; }

/* progress */
.mb-progress { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.mb-progress-fill { height: 100%; border-radius: 99px; }

/* toggle switch generic (reuse mb-switch) */

/* bank card visual */
.mb-plastic { border-radius: 18px; padding: 20px; height: 190px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
.mb-plastic::after { content:''; position:absolute; left:-40px; bottom:-60px; width:180px; height:180px; border-radius:50%; background: rgba(255,255,255,0.07); }
.mb-plastic.frozen { filter: grayscale(0.9) brightness(0.55); }
.mb-plastic-top { display: flex; justify-content: space-between; align-items: flex-start; }
.mb-plastic-chip { width: 34px; height: 25px; border-radius: 5px; background: linear-gradient(135deg, #E4C583, #A9812F); }
.mb-plastic-num { font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 3px; }
.mb-plastic-bottom { display: flex; justify-content: space-between; align-items: flex-end; font-size: 11px; }
.mb-plastic-frozen-badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 13px; letter-spacing: .03em; }

/* toasts */
.mb-toast-stack { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
.mb-toast { display: flex; align-items: center; gap: 10px; background: var(--surface-3); border: 1px solid var(--hairline-strong); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 13px; min-width: 260px; animation: mb-toast-in .2s ease; }
@keyframes mb-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* modal */
.mb-modal-overlay { position: fixed; inset: 0; background: rgba(5,8,14,0.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 150; padding: 20px; }
.mb-modal { background: var(--surface); border: 1px solid var(--hairline-strong); border-radius: 18px; width: 100%; max-width: 460px; padding: 26px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
.mb-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.mb-modal-head h3 { font-family: 'Fraunces', serif; font-size: 18px; margin: 0; }

/* empty */
.mb-empty { text-align: center; padding: 50px 20px; color: var(--muted); }

/* login */
.mb-login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
.mb-login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; padding: 36px 32px; box-shadow: var(--shadow); }
.mb-login-hint { font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--hairline); padding: 10px 12px; border-radius: 10px; margin-top: 16px; }

/* corporate homepage */
.mb-corp-inner { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
.mb-util-bar { background: var(--surface-3); border-bottom: 1px solid var(--hairline); font-size: 11.5px; }
.mb-util-inner { max-width: 1180px; margin: 0 auto; padding: 7px 32px; display: flex; justify-content: space-between; color: var(--muted); }
.mb-util-links { display: flex; gap: 18px; }
.mb-util-links span:hover { color: var(--text); cursor: default; }

.mb-corp-nav { border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(10px); z-index: 40; }
.mb-corp-nav-inner { max-width: 1180px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.mb-corp-links { display: flex; gap: 6px; }
.mb-corp-link { display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text); font-size: 13px; font-weight: 500; padding: 9px 11px; border-radius: 8px; }
.mb-corp-link:hover { background: var(--surface-2); }

.mb-corp-hero { padding: 50px 0 0; border-bottom: 1px solid var(--hairline); }
.mb-corp-hero-inner { max-width: 1180px; margin: 0 auto; padding: 0 32px 50px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; }
.mb-eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass-bright); font-weight: 600; margin-bottom: 10px; }
.mb-corp-hero h1 { font-size: 46px; font-weight: 600; line-height: 1.1; margin: 0; max-width: 560px; }
.mb-hero-trust { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.mb-corp-hero-visual { display: flex; justify-content: center; }

.mb-quicklinks-strip { background: var(--surface); border-bottom: 1px solid var(--hairline); }
.mb-quicklinks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hairline); }
.mb-quicklink { display: flex; align-items: center; justify-content: center; gap: 9px; background: var(--surface); border: none; color: var(--text); font-size: 12.5px; font-weight: 500; padding: 18px 12px; }
.mb-quicklink:hover { background: var(--surface-2); color: var(--brass-bright); }

.mb-home-section { padding: 56px 0; }
.mb-feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
.mb-feature-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; }

.mb-rate-banner { background: linear-gradient(100deg, var(--brass-bright), var(--brass)); }
.mb-rate-banner-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 30px 0; flex-wrap: wrap; }

.mb-security-row { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; }
.mb-trust-list { display: flex; flex-direction: column; gap: 9px; }
.mb-trust-item { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); }
.mb-app-download { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 22px; min-width: 260px; }
.mb-store-btn { display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1px solid var(--hairline-strong); border-radius: 10px; padding: 9px 14px; color: var(--text); }
.mb-store-btn:hover { border-color: var(--brass); }

.mb-corp-footer { background: var(--surface); border-top: 1px solid var(--hairline); padding: 46px 0 30px; }
.mb-footer-cols { display: flex; gap: 50px; flex-wrap: wrap; }
.mb-footer-h { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; margin-bottom: 10px; }
.mb-footer-link { font-size: 12.5px; padding: 4px 0; }
.mb-footer-fine { width: 100%; font-size: 11px; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--hairline); line-height: 1.6; }

@media (max-width: 860px) {
  .mb-util-bar, .mb-corp-links { display: none; }
  .mb-corp-hero-inner { grid-template-columns: 1fr; padding: 0 18px 36px; }
  .mb-corp-hero h1 { font-size: 32px; }
  .mb-quicklinks-grid { grid-template-columns: repeat(2, 1fr); }
  .mb-feature-grid { grid-template-columns: 1fr; }
  .mb-corp-inner { padding: 0 18px; }
  .mb-security-row { flex-direction: column; }
  .mb-corp-nav-inner { padding: 12px 18px; }
}

/* misc */
.mb-muted { color: var(--muted); }
.mb-flex { display: flex; align-items: center; }
.mb-gap-8 { gap: 8px; }
.mb-gap-12 { gap: 12px; }
.mb-mt-8 { margin-top: 8px; }
.mb-mt-16 { margin-top: 16px; }
.mb-mt-24 { margin-top: 24px; }
.mb-mb-16 { margin-bottom: 16px; }
.mb-mb-24 { margin-bottom: 24px; }

.mb-goal-ring { width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.mb-faq-item { border-bottom: 1px solid var(--hairline); padding: 14px 0; }
.mb-faq-q { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none; text-align: left; color: var(--text); font-size: 13.5px; font-weight: 600; }
.mb-faq-a { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.55; }
.mb-doc-row { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--hairline); }
.mb-doc-row:last-child { border-bottom: none; }
.mb-gauge-wrap { position: relative; width: 100%; height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--coral), var(--brass), var(--teal)); }
.mb-gauge-marker { position: absolute; top: -5px; width: 3px; height: 20px; background: var(--text); border-radius: 2px; transform: translateX(-50%); }

.mb-mobile-nav { display: none; }

@media (max-width: 860px) {
  .mb-shell { grid-template-columns: 1fr; }
  .mb-sidebar { display: none; }
  .mb-content { padding: 20px 16px 90px; }
  .mb-topbar { padding: 16px 18px; }
  .mb-grid-3 { grid-template-columns: 1fr; }
  .mb-grid-2 { grid-template-columns: 1fr; }
  .mb-quick-actions { grid-template-columns: repeat(2, 1fr); }
  .mb-hero-amount { font-size: 38px; }
  .mb-row { flex-direction: column; }
  .mb-mobile-nav {

    const toXY = (a, r) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
    const p1 = toXY(start, rOuter), p2 = toXY(end, rOuter), p3 = toXY(end, rInner), p4 = toXY(start, rInner);
    const large = (end - start) > 180 ? 1 : 0;
    const d1 = 'M ' + p1[0] + ' ' + p1[1] + ' A ' + rOuter + ' ' + rOuter + ' 0 ' + large + ' 1 ' + p2[0] + ' ' + p2[1] +
      ' L ' + p3[0] + ' ' + p3[1] + ' A ' + rInner + ' ' + rInner + ' 0 ' + large + ' 0 ' + p4[0] + ' ' + p4[1] + ' Z';
    paths += '<path d="' + d1 + '" fill="' + (CATEGORY_COLORS[d.name] || '#888') + '" stroke="var(--surface)" stroke-width="2"/>';
  });
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="100%" height="100%" style="max-width:220px;display:block;margin:0 auto">' + paths + '</svg>';
}

/* ============================== TRANSACTIONS ============================== */
function transactionRows() {
  const account = document.getElementById('tx-account') ? document.getElementById('tx-account').value : 'all';
  const category = document.getElementById('tx-category') ? document.getElementById('tx-category').value : 'all';
  const search = document.getElementById('tx-search') ? document.getElementById('tx-search').value : '';
  return transactions.filter(t =>
    (account === 'all' || t.accountId === account) &&
    (category === 'all' || t.category === category) &&
    (search === '' || t.merchant.toLowerCase().indexOf(search.toLowerCase()) !== -1)
  );
}
function filterTransactions() {
  const filtered = transactionRows();
  document.getElementById('tx-tbody').innerHTML = filtered.map(t =>
    '<tr><td class="mb-muted">' + fmtDate(t.date) + '</td><td>' + esc(t.merchant) + '</td>' +
    '<td><span class="mb-flex mb-gap-8">' + catDot(t.category) + t.category + '</span></td>' +
    '<td class="mb-muted">' + (accounts.find(a => a.id === t.accountId) || {}).name + '</td>' +
    '<td><span class="mb-badge ' + (t.status === 'pending' ? 'pending' : 'ok') + '">' + t.status + '</span></td>' +
    '<td class="num" style="text-align:right;color:' + (t.amount > 0 ? 'var(--teal)' : 'var(--text)') + '">' + (t.amount > 0 ? '+' : '') + money(t.amount) + '</td></tr>'
  ).join('') || '<tr><td colspan="6"><div class="mb-empty">No transactions match these filters.</div></td></tr>';
  document.getElementById('tx-count').textContent = filtered.length + ' transactions';
}
function exportCSV() {
  const filtered = transactionRows();
  const rows = [['Date', 'Merchant', 'Category', 'Account', 'Amount', 'Status']];
  filtered.forEach(t => rows.push([t.date, t.merchant, t.category, t.accountId, t.amount, t.status]));
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'meridian-transactions.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ============================== TRANSFERS ============================== */
function setTransferMode(m) { state.transfer = { mode: m, step: 'form', error: '' }; render(); }
function reviewTransfer(e) {
  e.preventDefault();
  const t = state.transfer;
  const from = document.getElementById('tf-from').value;
  const amount = parseFloat(document.getElementById('tf-amount').value);
  const memo = document.getElementById('tf-memo').value;
  const fromAcct = accounts.find(a => a.id === from);
  let to = null, recipient = '';
  if (t.mode === 'internal') { to = document.getElementById('tf-to').value; }
  else { recipient = document.getElementById('tf-recipient').value; }

  if (!amount || amount <= 0) { t.error = 'Enter an amount greater than $0.'; render(); return false; }
  if (t.mode === 'internal' && from === to) { t.error = 'Choose two different accounts.'; render(); return false; }
  if (amount > fromAcct.balance) { t.error = 'That exceeds the available balance on this account.'; render(); return false; }
  if (t.mode === 'p2p' && !recipient) { t.error = 'Enter a recipient name.'; render(); return false; }

  state.transfer = { mode: t.mode, step: 'review', from: from, to: to, amount: amount, memo: memo, recipient: recipient, error: '' };
  render();
  return false;
}
function confirmTransfer() {
  const t = state.transfer;
  if (t.mode === 'internal') doTransfer(t.from, t.to, t.amount, t.memo);
  else doP2P(t.from, t.recipient, t.amount, t.memo);
  state.transfer.step = 'success';
  render();
}
function backTransfer() { state.transfer.step = 'form'; render(); }
function resetTransfer() { state.transfer = { mode: state.transfer.mode, step: 'form', error: '' }; render(); }
function doTransfer(fromId, toId, amount, memo) {
  updateBalance(fromId, -amount);
  updateBalance(toId, amount);
  const fromName = accounts.find(a => a.id === fromId).name;
  const toName = accounts.find(a => a.id === toId).name;
  const today = new Date().toISOString().slice(0, 10);
  transactions = [
    { id: uid(), date: today, merchant: 'Transfer to ' + toName, category: 'Transfer', accountId: fromId, amount: -amount, status: 'posted' },
    { id: uid(), date: today, merchant: 'Transfer from ' + fromName, category: 'Transfer', accountId: toId, amount: amount, status: 'posted' },
  ].concat(transactions);
  addToast('Transferred ' + money(amount) + ' to ' + toName + '.');
}
function doP2P(fromId, recipient, amount, memo) {
  updateBalance(fromId, -amount);
  const today = new Date().toISOString().slice(0, 10);
  transactions = [{ id: uid(), date: today, merchant: 'Sent to ' + recipient, category: 'Transfer', accountId: fromId, amount: -amount, status: 'posted' }].concat(transactions);
  addToast('Sent ' + money(amount) + ' to ' + recipient + '.');
}

    const availableTo = accounts.filter(a => a.type !== 'credit');
    inner = '<div class="mb-tabs mb-mb-24">' +

      accounts.map(a => '<option value="' + a.id + '">' + a.name + ' — ' + money(a.balance) + '</option>').join('') + '</select></div>' +

          '<div class="mb-field"><label>Email or phone</label><input class="mb-input" id="tf-recipient-contact" placeholder="email@example.com"/></div>') +

      '<div class="mb-field"><label>Memo (optional)</label><input class="mb-input" id="tf-memo" placeholder="What is this for?"/></div>' +
      (t.error ? '<div style="color:var(--coral);font-size:12.5px;margin-bottom:12px">' + t.error + '</div>' : '') +
      '<button class="mb-btn mb-btn-primary block" type="submit">Review transfer</button>' +
    '</form>';
  } else if (t.step === 'review') {
    const fromAcct = accounts.find(a => a.id === t.from);
    const toLabel = t.mode === 'internal' ? accounts.find(a => a.id === t.to).name : t.recipient;
    inner = '<div class="mb-muted" style="font-size:12.5px;margin-bottom:14px">Review and confirm</div>' +
      '<div class="mb-flex" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hairline)"><span class="mb-muted">From</span><span>' + fromAcct.name + '</span></div>' +
      '<div class="mb-flex" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hairline)"><span class="mb-muted">To</span><span>' + toLabel + '</span></div>' +
      (t.memo ? '<div class="mb-flex" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hairline)"><span class="mb-muted">Memo</span><span>' + esc(t.memo) + '</span></div>' : '') +
      '<div class="mb-flex" style="justify-content:space-between;padding:10px 0"><span class="mb-muted">Amount</span><span class="num display" style="font-size:20px;font-weight:600">' + money(t.amount) + '</span></div>' +
      '<div class="mb-flex mb-gap-12 mb-mt-16">' +

      '<div class="display" style="font-size:19px;font-weight:600">Transfer complete</div>' +
      '<div class="mb-muted" style="font-size:13px;margin:6px 0 20px">' + money(t.amount) + ' sent successfully.</div>' +
      '<button type="button" class="mb-btn mb-btn-secondary block" onclick="resetTransfer()">Make another transfer</button></div>';
  }
  return '<div><div class="mb-section-head mb-mb-16"><h2 style="font-size:20px">Transfers</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-card" style="max-width:480px">' + inner + '</div></div>';
}

function payNow(payeeId, fromAccountId, amount) {

  const today = new Date().toISOString().slice(0, 10);
  transactions = [{ id: uid(), date: today, merchant: payee.name, category: payee.category, accountId: fromAccountId, amount: -amount, status: 'posted' }].concat(transactions);
  addToast('Paid ' + money(amount) + ' to ' + payee.name + '.');
}

}

function renderBudget() {
  const spentByCat = {};
  transactions.forEach(t => { if (t.amount < 0) spentByCat[t.category] = (spentByCat[t.category] || 0) + Math.abs(t.amount); });
  const pieData = Object.keys(spentByCat).map(name => ({ name: name, value: spentByCat[name] })).sort((a, b) => b.value - a.value);
  const budgets = Object.keys(BUDGET_LIMITS).map(cat => ({ cat: cat, limit: BUDGET_LIMITS[cat], spent: spentByCat[cat] || 0 }));
  const overBudget = budgets.find(b => b.spent > b.limit);

  let html = '<div><div class="mb-section-head mb-mb-16"><h2 style="font-size:20px">Budget & analytics</h2></div><div class="mb-ledger-rule"></div>';
  html += '<div class="mb-grid-2 mb-mb-24">' +
    '<div class="mb-card"><div class="mb-section-head"><h2>Where it is going</h2></div><div class="mb-ledger-rule"></div>' +
    '<div style="height:240px">' + miniDonut(pieData) + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11.5px">' +
    pieData.map(p => '<span class="mb-flex mb-gap-8">' + catDot(p.name) + p.name + '<span class="mb-muted num" style="margin-left:auto">' + money(p.value) + '</span></span>').join('') +
    '</div></div>' +
    '<div class="mb-card"><div class="mb-section-head"><h2>Income vs. spending</h2></div><div class="mb-ledger-rule"></div>' +
    '<div style="height:240px">' + miniBarChart(TREND) + '</div></div>' +
  '</div>';

  if (overBudget) {
    html += '<div class="mb-card mb-mb-24" style="border-color:color-mix(in srgb, var(--coral) 40%, transparent)"><div class="mb-flex mb-gap-12">' +
      icon('alert', 18, 'style="color:var(--coral)"') + '<div style="font-size:13px">You are ' + money(overBudget.spent - overBudget.limit) + ' over your ' + overBudget.cat + ' budget this cycle.</div></div></div>';
  }

  html += '<div class="mb-card"><div class="mb-section-head"><h2>Budgets this cycle</h2></div><div class="mb-ledger-rule"></div>';
  budgets.forEach(b => {
    const pct = Math.min(100, (b.spent / b.limit) * 100);
    const color = b.spent > b.limit ? 'var(--coral)' : pct > 70 ? 'var(--brass)' : 'var(--teal)';
    html += '<div class="mb-mb-16"><div class="mb-flex" style="justify-content:space-between;font-size:12.5px;margin-bottom:6px">' +
      '<span class="mb-flex mb-gap-8">' + catDot(b.cat) + b.cat + '</span><span class="mb-muted num">' + money(b.spent) + ' of ' + money(b.limit) + '</span></div>' +
      '<div class="mb-progress"><div class="mb-progress-fill" style="width:' + pct + '%;background:' + color + '"></div></div></div>';
  });
  html += '</div></div>';
  return html;
}

/* ============================== STATEMENTS ============================== */
function downloadStatement(id) {
  const doc = STATEMENTS.find(s => s.id === id);
  if (!doc) return;
  const content = 'Meridian Bank\\n' + doc.label + '\\nAccount: ' + doc.account + '\\nIssued: ' + doc.date + '\\n\\nThis is a simulated document for demo purposes.';
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = doc.label.replace(/\\s+/g, '-') + '.txt'; a.click();
  URL.revokeObjectURL(url);
}
function renderStatements() {
  return '<div><div class="mb-section-head mb-mb-16"><h2 style="font-size:20px">Statements & documents</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-card pad-0">' + STATEMENTS.map(doc =>
      '<div class="mb-doc-row"><div class="mb-tx-icon">' + icon('file', 16, 'style="color:var(--brass-bright)"') + '</div>' +
      '<div style="flex:1"><div style="font-weight:600;font-size:13.5px">' + doc.label + '</div>' +
      '<div class="mb-muted" style="font-size:11.5px">' + doc.account + ' · Issued ' + fmtDate(doc.date) + '</div></div>' +
      '<button type="button" class="mb-btn mb-btn-secondary sm" onclick="downloadStatement(\'' + doc.id + '\')">' + icon('download', 13) + ' Download</button></div>'
    ).join('') + '</div>' +
    '<div class="mb-muted" style="font-size:12px;margin-top:12px">Statements are generated monthly and kept on file for 7 years, as required for account records.</div></div>';
}

/* ============================== SUPPORT ============================== */
function toggleFaq(i) { state.openFaq = state.openFaq === i ? -1 : i; render(); }
function sendSupportMessage(e) {
  e.preventDefault();
  const msg = document.getElementById('support-message').value;
  if (!msg.trim()) return false;
  document.getElementById('support-message').value = '';
  addToast('Message sent — our team replies within 1 business day.');
  return false;
}
function renderSupport() {
  return '<div><div class="mb-section-head mb-mb-16"><h2 style="font-size:20px">Support</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-grid-2"><div class="mb-card"><div class="mb-section-head"><h2>Frequently asked</h2></div><div class="mb-ledger-rule"></div>' +
    FAQS.map((f, i) => '<div class="mb-faq-item"><button type="button" class="mb-faq-q" onclick="toggleFaq(' + i + ')">' + f.q + ' ' + icon(state.openFaq === i ? 'chevronUp' : 'chevronDown', 15) + '</button>' +
      (state.openFaq === i ? '<div class="mb-faq-a">' + f.a + '</div>' : '') + '</div>').join('') +
    '</div><div><div class="mb-card mb-mb-16"><div class="mb-section-head"><h2>Message us</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-muted" style="font-size:12.5px;margin-bottom:12px">Secure messages are encrypted and tied to your account — no need to share sensitive details over email.</div>' +
    '<form onsubmit="return sendSupportMessage(event)"><div class="mb-field"><textarea class="mb-input" id="support-message" rows="4" placeholder="How can we help?" style="resize:vertical;font-family:inherit"></textarea></div>' +
    '<button class="mb-btn mb-btn-primary block" type="submit">' + icon('message', 14) + ' Send secure message</button></form></div>' +
    '<div class="mb-card"><div class="mb-section-head"><h2>Other ways to reach us</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-muted" style="font-size:12.5px;line-height:1.8">Call 1-800-555-0182, 24/7<br/>Live chat — available in the mobile app<br/>Branch & ATM locator — find one near you</div></div>' +
    '</div></div></div>';
}

/* ============================== SETTINGS ============================== */
let settingsAlerts = { tx: true, lowBalance: true, marketing: false };
let settings2FA = true;
function saveProfile(e) {
  e.preventDefault();
  state.profile = {
    name: document.getElementById('set-name').value,
    email: document.getElementById('set-email').value,
    phone: document.getElementById('set-phone').value,
  };
  addToast('Profile updated.');
  render();
  return false;
}
function toggleAlert(key) { settingsAlerts[key] = !settingsAlerts[key]; render(); }
function toggle2FA() { settings2FA = !settings2FA; render(); }
function changePassword() { addToast('Password change link sent to your email.'); }
function renderSettings() {
  const p = state.profile;
  return '<div><div class="mb-section-head mb-mb-16"><h2 style="font-size:20px">Settings</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-grid-2"><div>' +
    '<div class="mb-card mb-mb-16"><div class="mb-section-head"><h2>Profile</h2></div><div class="mb-ledger-rule"></div>' +
    '<form onsubmit="return saveProfile(event)">' +
    '<div class="mb-field"><label>Full name</label><input class="mb-input" id="set-name" value="' + esc(p.name) + '"/></div>' +
    '<div class="mb-field"><label>Email</label><input class="mb-input" id="set-email" value="' + esc(p.email) + '"/></div>' +
    '<div class="mb-field"><label>Phone</label><input class="mb-input" id="set-phone" value="' + esc(p.phone) + '"/></div>' +
    '<button class="mb-btn mb-btn-primary" type="submit">Save changes</button></form></div>' +
    '<div class="mb-card"><div class="mb-section-head"><h2>Notifications</h2></div><div class="mb-ledger-rule"></div>' +
    [['tx', 'Transaction alerts'], ['lowBalance', 'Low balance alerts'], ['marketing', 'Product news & offers']].map(kv =>
      '<div class="mb-flex" style="justify-content:space-between;padding:9px 0"><span style="font-size:13px">' + kv[1] + '</span>' + switchHtml(settingsAlerts[kv[0]], "toggleAlert('" + kv[0] + "')") + '</div>'
    ).join('') + '</div></div>' +
    '<div><div class="mb-card mb-mb-16"><div class="mb-section-head"><h2>Security</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-flex" style="justify-content:space-between;padding:9px 0"><span class="mb-flex mb-gap-8" style="font-size:13px">' + icon('shield', 14) + ' Two-factor authentication</span>' + switchHtml(settings2FA, 'toggle2FA()') + '</div>' +
    '<div class="mb-flex" style="justify-content:space-between;padding:9px 0"><span class="mb-flex mb-gap-8" style="font-size:13px">' + icon('mail', 14) + ' Sign-in email alerts</span>' + switchHtml(true, '') + '</div>' +
    '<button type="button" class="mb-btn mb-btn-secondary block mb-mt-16" onclick="changePassword()">Change password</button>' +
    '<div class="mb-mt-24"><div class="mb-muted" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Active sessions</div>' +
    '<div class="mb-flex" style="justify-content:space-between;padding:8px 0;font-size:12.5px"><span class="mb-flex mb-gap-8">' + icon('smartphone', 13) + ' This device · Chrome <span class="mb-badge ok">this device</span></span><span class="mb-muted">Active now</span></div>' +
    '<div class="mb-flex" style="justify-content:space-between;padding:8px 0;font-size:12.5px"><span class="mb-flex mb-gap-8">' + icon('smartphone', 13) + ' iPhone 15 · Meridian App</span><span class="mb-muted">2 days ago</span></div>' +
    '</div></div>' +
    '<div class="mb-card"><div class="mb-section-head"><h2>Appearance</h2></div><div class="mb-ledger-rule"></div>' +
    '<div class="mb-flex" style="justify-content:space-between"><span style="font-size:13px">Dark mode</span>' + switchHtml(state.theme === 'dark', 'toggleTheme()') + '</div></div>' +
    '</div></div></div>';
}
/* ============================== MODAL ============================== */
function openModal(type, payload) {
  if (type === 'pay') state.modal = { type: 'pay', payeeId: payload };
  else if (type === 'lost') state.modal = { type: 'lost', cardId: payload };
  else state.modal = { type: type };
  render();
}
function closeModal() { state.modal = null; render(); }
function simulateDeposit() { state.modal = null; render(); addToast('Check deposit simulated — funds available in 1-2 business days.'); }
function confirmLostCard() {
  const cardId = state.modal.cardId;
  state.modal = null;
  toggleFreeze(cardId);
  addToast('Card reported and locked. A replacement is on its way.');
}
function renderModal() {
  if (!state.modal) return '';
  const m = state.modal;
  let title = '', body = '';
  if (m.type === 'deposit') {
    title = 'Deposit a check';
    body = '<div style="text-align:center;padding:10px 0">' +
      '<div class="mb-muted" style="font-size:13px;margin-bottom:18px">Mobile check deposit uses your camera to capture the front and back of a check. This is simulated in the demo.</div>' +
      '<button type="button" class="mb-btn mb-btn-primary block" onclick="simulateDeposit()">Simulate deposit</button></div>';
  } else if (m.type === 'lost') {
    const card = cards.find(c => c.id === m.cardId);
    title = 'Report card lost or stolen';
    body = '<div class="mb-muted" style="font-size:13px;margin-bottom:18px">We will immediately lock •••• ' + (card ? card.last4 : '') + ' and overnight a replacement card, free of charge.</div>' +
      '<button type="button" class="mb-btn mb-btn-danger block" onclick="confirmLostCard()">Confirm report</button>';
  } else if (m.type === 'pay') {
    const payee = payees.find(p => p.id === m.payeeId);
    title = 'Pay ' + (payee ? payee.name : '');
    body = '<div class="mb-field"><label>From account</label><select class="mb-select" id="pay-from">' +
      accounts.filter(a => a.type !== 'credit').map(a => '<option value="' + a.id + '">' + a.name + ' — ' + money(a.balance) + '</option>').join('') + '</select></div>' +
      '<div class="mb-field"><label>Amount</label><input class="mb-input num" id="pay-amount" type="number" step="0.01" value="' + (payee ? payee.avgAmount : 0) + '"/></div>' +
      '<button type="button" class="mb-btn mb-btn-primary block" onclick="confirmPay()">Confirm payment</button>';
  } else if (m.type === 'addPayee') {
    title = 'Add a payee';
    const catOptions = Object.keys(CATEGORY_COLORS).map(c => '<option value="' + c + '">' + c + '</option>').join('');
    body = '<form onsubmit="return submitAddPayee(event)">' +
      '<div class="mb-field"><label>Payee name</label><input class="mb-input" id="payee-name" placeholder="e.g. State Farm Insurance"/></div>' +
      '<div class="mb-field"><label>Category</label><select class="mb-select" id="payee-cat">' + catOptions + '</select></div>' +
      '<button class="mb-btn mb-btn-primary block" type="submit">Add payee</button></form>';
  }
  return '<div class="mb-modal-overlay" onclick="if(event.target===event.currentTarget) closeModal()">' +
    '<div class="mb-modal"><div class="mb-modal-head"><h3>' + title + '</h3>' +
    '<button type="button" class="mb-icon-btn" onclick="closeModal()">' + icon('x', 16) + '</button></div>' +
    body + '</div></div>';
}

/* ============================== INIT ============================== */
render();
</script>
</body>
</html>
